name: APK Derle
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP aç
        run: unzip -q "$(ls Vakit-*.zip | sort | tail -1)" && sed -i 's/^import androidx.compose.ui.graphics.StrokeCap$/import androidx.compose.ui.graphics.StrokeCap\nimport androidx.compose.ui.graphics.nativeCanvas/' Vakit/app/src/main/java/com/vakit/app/ui/QiblaScreen.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: SDK bileşenleri
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0"
      - name: APK derle
        working-directory: Vakit
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Vakit-APK
          path: Vakit/app/build/outputs/apk/debug/*.apk
